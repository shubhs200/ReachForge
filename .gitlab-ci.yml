stages:
  - build
  - test
  - publish

# Basic sanity checks and validation
validate:rf:
  stage: test
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
  script:
    - chmod +x scripts/ci-validate.sh || true
    - ./scripts/ci-validate.sh
  allow_failure: false

# Build and publish ReachForge CI image
publish:docker-image:
  stage: publish
  image:
    name: ${CI_REGISTRY}/general/docker-images/docker-builder:latest
  script:
    - TAGS=git-${CI_COMMIT_SHORT_SHA} NAME=reachforge-1.0 DOCKERFILE=Dockerfile.ci /build.sh
  artifacts:
    expire_in: 1 week
